<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – SISTec IoT 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Rajdhani', sans-serif; }
    h1, .brand { font-family: 'Orbitron', monospace; }
    .bg-grid {
      background-color: #0a0f1e;
      background-image:
        linear-gradient(rgba(0,255,200,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,200,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glow-border {
      box-shadow: 0 0 0 1px rgba(0,255,200,0.3), 0 0 30px rgba(0,255,200,0.1);
    }
    .glow-btn {
      box-shadow: 0 0 20px rgba(0,255,200,0.4);
      transition: all 0.2s;
    }
    .glow-btn:hover {
      box-shadow: 0 0 35px rgba(0,255,200,0.7);
      transform: translateY(-1px);
    }
    input:focus { outline: none; box-shadow: 0 0 0 2px rgba(0,255,200,0.5); }
    .scan-line {
      animation: scan 3s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(800%); opacity: 0; }
    }
  </style>
</head>
<body class="bg-grid min-h-screen flex items-center justify-center px-4">

  <!-- Scan line effect -->
  <div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-teal-400 to-transparent opacity-30 scan-line pointer-events-none z-50"></div>

  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 mb-2">
        <div class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></div>
        <span class="text-teal-400 text-xs tracking-[0.3em] uppercase">System Online</span>
        <div class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></div>
      </div>
      <h1 class="brand text-2xl text-white leading-tight">SISTec IoT</h1>
      <p class="text-teal-400 text-sm tracking-widest mt-1">APPLICATION 2026</p>
    </div>

    <!-- Card -->
    <div class="bg-gray-900 bg-opacity-80 border border-teal-900 rounded-2xl p-8 glow-border">
      <h2 class="text-white text-xl font-semibold mb-1">Welcome Back</h2>
      <p class="text-gray-400 text-sm mb-6">Sign in to access the IoT dashboard</p>

      <form action="/login" method="POST" class="space-y-5">
        <div>
          <label class="block text-gray-400 text-sm mb-1 tracking-wide">EMAIL ADDRESS</label>
          <input
            type="email" name="email" required placeholder="you@sistec.ac.in"
            class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 text-sm placeholder-gray-600 transition"
          />
        </div>
        <div>
          <label class="block text-gray-400 text-sm mb-1 tracking-wide">PASSWORD</label>
          <input
            type="password" name="password" required placeholder="••••••••"
            class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 text-sm placeholder-gray-600 transition"
          />
        </div>
        <button type="submit"
          class="w-full bg-teal-500 hover:bg-teal-400 text-gray-900 font-bold py-3 rounded-lg text-sm tracking-widest uppercase glow-btn mt-2">
          LOGIN →
        </button>
      </form>

      <p class="text-center text-gray-500 text-sm mt-6">
        No account?
        <a href="/register.html" class="text-teal-400 hover:text-teal-300 font-semibold ml-1">Register Here</a>
      </p>
    </div>

    <p class="text-center text-gray-700 text-xs mt-6 tracking-widest">SISTec © 2026 · IoT LAB</p>
  </div>

</body>
</html>
